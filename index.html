<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counter</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f0;
    color: #222;
    margin: 0;
    padding: 40px 20px;
    text-align: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 30px; }
  .val {
    font-size: 72px;
    font-weight: 600;
    margin: 20px 0;
  }
  button {
    border: 1px solid #c8c8c2;
    background: #fff;
    padding: 10px 18px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    margin: 0 4px;
  }
  button:hover { background: #f0f0ea; }
  .reset { display: block; margin: 20px auto 0; }
</style>
</head>
<body>

<h1>counter</h1>
<div class="val" id="val">0</div>

<div>
  <button id="dec">-</button>
  <button id="inc">+</button>
</div>
<button class="reset" id="reset">reset</button>

<script>
const KEY = "counter.v1";
let n = parseInt(localStorage.getItem(KEY) || "0", 10) || 0;

function paint() {
  document.getElementById("val").textContent = n;
  localStorage.setItem(KEY, String(n));
}

document.getElementById("inc").onclick = () => { n++; paint(); };
document.getElementById("dec").onclick = () => { n--; paint(); };
document.getElementById("reset").onclick = () => { n = 0; paint(); };

paint();
</script>

</body>
</html>
