<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counter</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f0;
    color: #222;
    margin: 0;
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #777; font-size: 13px; margin-bottom: 20px; }
  .total {
    background: #222;
    color: #fff;
    padding: 14px 18px;
    border-radius: 6px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .total .v { font-size: 26px; font-weight: 600; }
  .add-form {
    background: #fff;
    border: 1px solid #e2e2dc;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-form input {
    border: 1px solid #d6d6d0;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
  }
  .add-form input[name=label] { flex: 1; min-width: 140px; }
  .add-form input[name=step] { width: 80px; }
  button {
    border: 1px solid #c8c8c2;
    background: #fff;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }
  button:hover { background: #f0f0ea; }
  button.primary {
    background: #222;
    color: #fff;
    border-color: #222;
  }
  button.primary:hover { background: #444; }
  .counters { display: flex; flex-direction: column; gap: 10px; }
  .counter {
    background: #fff;
    border: 1px solid #e2e2dc;
    border-radius: 6px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .counter .name { font-weight: 600; font-size: 15px; }
  .counter .meta { font-size: 12px; color: #888; margin-top: 2px; }
  .counter .val {
    font-size: 24px;
    font-weight: 600;
    min-width: 60px;
    text-align: right;
  }
  .counter .actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .counter .actions .spacer { flex: 1; }
  .empty {
    text-align: center;
    color: #999;
    padding: 30px 0;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>counter</h1>
<div class="sub">tally counters with custom step sizes. saved in your browser.</div>

<div class="total">
  <span>sum across all</span>
  <span class="v" id="total">0</span>
</div>

<form class="add-form" id="addForm">
  <input name="label" placeholder="what are you counting?" required>
  <input name="step" type="number" value="1" step="any" required>
  <button class="primary" type="submit">add counter</button>
</form>

<div class="counters" id="counters"></div>

<script>
const KEY = "counter.v2";
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed;
  } catch (e) {
    return [];
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function round(n) {
  // step can be a float, avoid 0.1+0.2 ugliness
  return Math.round(n * 1e6) / 1e6;
}

function render() {
  const wrap = document.getElementById("counters");
  wrap.innerHTML = "";

  if (state.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "no counters yet. add one above.";
    wrap.appendChild(e);
  }

  for (const c of state) {
    const el = document.createElement("div");
    el.className = "counter";
    el.innerHTML = `
      <div>
        <div class="name"></div>
        <div class="meta">step: <span class="step"></span></div>
      </div>
      <div class="val">0</div>
      <div class="actions">
        <button data-act="dec">-</button>
        <button data-act="inc">+</button>
        <span class="spacer"></span>
        <button data-act="reset">reset</button>
        <button data-act="remove">remove</button>
      </div>
    `;
    el.querySelector(".name").textContent = c.label;
    el.querySelector(".step").textContent = c.step;
    el.querySelector(".val").textContent = c.value;

    el.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => act(c.id, b.dataset.act));
    });

    wrap.appendChild(el);
  }

  const sum = state.reduce((a, c) => a + c.value, 0);
  document.getElementById("total").textContent = round(sum);
}

function act(id, kind) {
  const c = state.find(x => x.id === id);
  if (!c) return;
  if (kind === "inc") c.value = round(c.value + c.step);
  else if (kind === "dec") c.value = round(c.value - c.step);
  else if (kind === "reset") c.value = 0;
  else if (kind === "remove") {
    if (!confirm("remove " + c.label + "?")) return;
    state = state.filter(x => x.id !== id);
  }
  save();
  render();
}

document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  const label = f.label.value.trim();
  const step = parseFloat(f.step.value);
  if (!label || !Number.isFinite(step) || step === 0) return;
  state.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    label,
    step,
    value: 0
  });
  save();
  render();
  f.reset();
  f.step.value = 1;
  f.label.focus();
});

render();
</script>

</body>
</html>
